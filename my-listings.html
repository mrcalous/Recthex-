<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recthex - My Listings</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/ozkhiygd/image/upload/v1789628303/file_00000000ef58821080c1b2874103b015.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f7f9fc;
            color: #333;
            padding: 15px;
            padding-bottom: 40px;
        }
        .header-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-link { color: #0a3d62; text-decoration: none; font-weight: bold; font-size: 16px; }
        h1 { font-size: 20px; color: #0a3d62; }

        .listing-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid #eef2f5;
        }
        .listing-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; color: #1e293b; }
        .listing-meta { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        .listing-price { font-weight: bold; color: #10b981; margin-bottom: 10px; }

        .status-toggle {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .status-toggle.available { background: #dcfce7; color: #166534; }
        .status-toggle.occupied { background: #fee2e2; color: #991b1b; }

        .card-actions { display: flex; gap: 8px; }
        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-toggle-status { background: #e0e7ff; color: #3730a3; }

        .empty-state { text-align: center; padding: 40px 15px; color: #64748b; }
        .empty-state a { color: #0a3d62; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="back-link">← Back</a>
        <h1>My Listings</h1>
    </div>

    <div id="listingsContainer">
        <div class="empty-state">Loading your listings…</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            query,
            where,
            orderBy,
            onSnapshot,
            doc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

 const firebaseConfig = {
    apiKey: "AIzaSyBUCDC1N9StMF81Ur831JLpgI4xfG-H4mU",
    authDomain: "recthex-new1.firebaseapp.com",
    projectId: "recthex-new1",
    storageBucket: "recthex-new1.firebasestorage.app",
    messagingSenderId: "184930734727",
    appId: "1:184930734727:web:f2b58d546d3504c8785e22",
    measurementId: "G-FX8QGN9MKJ"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        const container = document.getElementById('listingsContainer');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html?redirect=my-listings.html';
                return;
            }

            const myQuery = query(
    collection(db, "properties"),
    where("ownerId", "==", user.uid)
);

const sortedDocs = (snap) => snap.docs.slice().sort((a, b) => {
    const ta = a.data().createdAt && a.data().createdAt.toMillis ? a.data().createdAt.toMillis() : Date.now();
    const tb = b.data().createdAt && b.data().createdAt.toMillis ? b.data().createdAt.toMillis() : Date.now();
    return tb - ta;
});

            onSnapshot(myQuery, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state">You haven\'t posted any properties yet. <a href="add-property.html">Post one now</a>.</div>';
                    return;
                }

                container.innerHTML = '';
                sortedDocs(snapshot).forEach((docSnap) => {
                    const house = docSnap.data();
                    const isOccupied = house.status === 'occupied';
                    const price = Number(house.price) || 0;

                    const card = document.createElement('div');
                    card.className = 'listing-card';
                    card.innerHTML =
                        '<div class="listing-title">' + escapeHtml(house.title || 'Untitled') + '</div>' +
                        '<div class="listing-meta">📍 ' + escapeHtml(house.gateLocation || '') + '</div>' +
                        '<div class="listing-price">₦' + price.toLocaleString() + ' / year</div>' +
                        '<div class="status-toggle ' + (isOccupied ? 'occupied' : 'available') + '">' +
                            (isOccupied ? 'Occupied' : 'Available') +
                        '</div>' +
                        '<div class="card-actions">' +
                            '<button class="btn-action btn-toggle-status">Mark as ' + (isOccupied ? 'Available' : 'Occupied') + '</button>' +
                            '<button class="btn-action btn-delete">🗑️ Delete</button>' +
                        '</div>';

                    card.querySelector('.btn-toggle-status').addEventListener('click', async () => {
                        try {
                            await updateDoc(doc(db, "properties", docSnap.id), {
                                status: isOccupied ? 'available' : 'occupied'
                            });
                        } catch (err) {
                            alert('Could not update status: ' + err.message);
                        }
                    });

                    card.querySelector('.btn-delete').addEventListener('click', async () => {
                        if (!confirm('Delete "' + (house.title || 'this listing') + '"? This cannot be undone.')) return;
                        try {
                            await deleteDoc(doc(db, "properties", docSnap.id));
                        } catch (err) {
                            alert('Could not delete: ' + err.message);
                        }
                    });

                    container.appendChild(card);
                });
            }, (error) => {
                console.error(error);
                container.innerHTML = '<div class="empty-state">Couldn\'t load your listings. Please check your connection.</div>';
            });
        });
    </script>
</body>
</html>
